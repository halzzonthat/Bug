<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bug — Bio</title>
  <meta name="description" content="Bug's personal bio page." />

  <!-- ========== FONTS ========== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ================================================
       RESET & BASE
       ================================================ */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: #e0e0e0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ================================================
       VIDEO BACKGROUND
       ================================================ */
    #bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
    }

    /* Subtle dark overlay so the card pops */
    #bg-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        rgba(0, 0, 0, 0.35) 0%,
        rgba(0, 0, 0, 0.7) 100%
      );
      z-index: 1;
      pointer-events: none;
    }

    /* ================================================
       SPLASH / CLICK-TO-ENTER OVERLAY
       ================================================ */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #splash-text {
      font-size: 1.15rem;
      font-weight: 300;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
      position: relative;
      padding-bottom: 4px;
    }

    /* Thin animated underline */
    #splash-text::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.4);
      animation: expandLine 2.4s ease-in-out infinite alternate;
    }

    @keyframes expandLine {
      0%   { width: 0;   left: 50%; }
      100% { width: 100%; left: 0;   }
    }

    /* Subtle skull icon above the text */
    #splash-icon {
      margin-bottom: 28px;
      opacity: 0.3;
    }

    #splash-icon svg {
      width: 44px;
      height: 44px;
      animation: floatSkull 3s ease-in-out infinite;
    }

    @keyframes floatSkull {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    /* ================================================
       MAIN CONTENT WRAPPER
       ================================================ */
    #main-content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      opacity: 0;
      transition: opacity 1s ease 0.3s;
    }

    #main-content.visible {
      opacity: 1;
    }

    /* ================================================
       PROFILE CARD — GLASSMORPHISM
       ================================================ */
    .card {
      width: 340px;
      padding: 44px 36px 36px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(28px) saturate(1.3);
      -webkit-backdrop-filter: blur(28px) saturate(1.3);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      transform-style: preserve-3d;
      will-change: transform;
      transition: transform 0.35s cubic-bezier(0.23, 1, 0.32, 1);
    }

    /* ================================================
       AVATAR
       ================================================ */
    .avatar-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.15),
        rgba(255, 255, 255, 0.03)
      );
      box-shadow:
        0 0 20px rgba(180, 180, 200, 0.08),
        0 0 60px rgba(180, 180, 200, 0.04);
      flex-shrink: 0;
    }

    .avatar-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    /* ================================================
       DISPLAY NAME
       ================================================ */
    .display-name {
      font-size: 1.65rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #fff;
      text-align: center;
    }

    /* ================================================
       TYPEWRITER BIO
       ================================================ */
    .bio-line {
      font-size: 0.88rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
      min-height: 1.4em;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bio-line .cursor {
      display: inline-block;
      width: 1px;
      height: 1em;
      background: rgba(255, 255, 255, 0.45);
      margin-left: 2px;
      animation: blink 0.85s step-end infinite;
      vertical-align: text-bottom;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }

    /* ================================================
       DIVIDER
       ================================================ */
    .divider {
      width: 50px;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
    }

    /* ================================================
       SOCIAL ICONS
       ================================================ */
    .socials {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: transform 0.3s ease, background 0.3s ease, border-color 0.3s ease;
      text-decoration: none;
    }

    .social-link svg {
      width: 20px;
      height: 20px;
      fill: rgba(255, 255, 255, 0.4);
      transition: fill 0.3s ease;
    }

    .social-link:hover {
      transform: scale(1.12);
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .social-link:hover svg {
      fill: rgba(255, 255, 255, 0.8);
    }

    /* ================================================
       RESPONSIVE TWEAKS
       ================================================ */
    @media (max-width: 420px) {
      .card {
        width: 90vw;
        padding: 36px 24px 28px;
      }
      .avatar-ring {
        width: 110px;
        height: 110px;
      }
      .display-name {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>

  <!-- ========== BACKGROUND VIDEO ========== -->
  <video id="bg-video" loop muted playsinline autoplay>
    <source src="bg.mp4" type="video/mp4" />
  </video>
  <div id="bg-overlay"></div>

  <!-- ========== SPLASH OVERLAY ========== -->
  <div id="splash">
    <div id="splash-icon">
      <!-- Minimal skull / skeleton motif -->
      <svg viewBox="0 0 24 24" fill="rgba(255,255,255,0.55)" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12c0 3.69 2.47 6.86 6 8.25V22h2v-1h4v1h2v-1.75c3.53-1.39 6-4.56 6-8.25 0-5.52-4.48-10-10-10zm-3 13a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm6 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/>
      </svg>
    </div>
    <span id="splash-text">Click to Enter</span>
  </div>

  <!-- ========== MAIN CONTENT ========== -->
  <div id="main-content">
    <div class="card" id="card">

      <!-- Avatar -->
      <div class="avatar-ring">
        <img src="main.png" alt="Bug's avatar" />
      </div>

      <!-- Display Name -->
      <h1 class="display-name">Bug</h1>

      <!-- Typewriter Bio -->
      <p class="bio-line" id="bio">
        <span id="bio-text"></span><span class="cursor"></span>
      </p>

      <!-- Divider -->
      <hr class="divider" />

      <!-- Social Icons -->
      <div class="socials">
        <!-- ============================
             DISCORD — update the href
             ============================ -->
        <a
          href="https://discord.com"
          target="_blank"
          rel="noopener noreferrer"
          class="social-link"
          aria-label="Discord"
        >
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.947 2.418-2.157 2.418z"/>
          </svg>
        </a>

        <!-- ============================
             TELEGRAM — update the href
             ============================ -->
        <a
          href="https://t.me"
          target="_blank"
          rel="noopener noreferrer"
          class="social-link"
          aria-label="Telegram"
        >
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0h-.056zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.479.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
          </svg>
        </a>
      </div>
    </div>
  </div>

  <!-- ========== JAVASCRIPT ========== -->
  <script>
    /* ================================================
       CONFIGURATION — edit these to customise
       ================================================ */

    // Typewriter bio strings (cycle through these)
    const BIO_STRINGS = [
      'building things that shouldn\'t exist.',
      'code · chaos · curiosity.',
      'skeleton in the machine.'
    ];

    const TYPE_SPEED   = 60;   // ms per character typed
    const DELETE_SPEED = 35;   // ms per character deleted
    const PAUSE_AFTER  = 2000; // ms to hold the full string

    /* ================================================
       SPLASH → ENTER
       ================================================ */
    const splash  = document.getElementById('splash');
    const video   = document.getElementById('bg-video');
    const content = document.getElementById('main-content');

    splash.addEventListener('click', () => {
      // Unmute and play the video with audio
      video.muted = false;
      video.play().catch(() => {});

      // Fade out splash, reveal content
      splash.classList.add('hidden');
      content.classList.add('visible');
    });

    /* ================================================
       3D PARALLAX TILT
       ================================================ */
    const card     = document.getElementById('card');
    const MAX_TILT = 14; // degrees

    function handleMouseMove(e) {
      const { innerWidth: w, innerHeight: h } = window;
      // Normalise mouse position to -1 … 1
      const x = (e.clientX / w - 0.5) * 2;  // -1 (left) → 1 (right)
      const y = (e.clientY / h - 0.5) * 2;  // -1 (top)  → 1 (bottom)

      // Tilt: mouse left → card rotates so right side comes forward (rotateY positive)
      const rotateY = x * MAX_TILT * -1;
      const rotateX = y * MAX_TILT;

      card.style.transform =
        `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
    }

    function handleMouseLeave() {
      card.style.transform = 'rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
    }

    window.addEventListener('mousemove', handleMouseMove);
    window.addEventListener('mouseleave', handleMouseLeave);

    /* ================================================
       TYPEWRITER ENGINE
       ================================================ */
    const bioText = document.getElementById('bio-text');
    let stringIdx = 0;

    async function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    async function typeString(str) {
      for (let i = 0; i <= str.length; i++) {
        bioText.textContent = str.slice(0, i);
        await sleep(TYPE_SPEED);
      }
    }

    async function deleteString(str) {
      for (let i = str.length; i >= 0; i--) {
        bioText.textContent = str.slice(0, i);
        await sleep(DELETE_SPEED);
      }
    }

    async function typewriterLoop() {
      while (true) {
        const current = BIO_STRINGS[stringIdx];
        await typeString(current);
        await sleep(PAUSE_AFTER);
        await deleteString(current);
        await sleep(400); // brief gap before next string
        stringIdx = (stringIdx + 1) % BIO_STRINGS.length;
      }
    }

    typewriterLoop();
  </script>
</body>
</html>
